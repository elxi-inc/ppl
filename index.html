<style>
/* Layout: sticky header + scrollable tab strip, one working column. Form-first, summary tab shows what is still empty. */
:root {
  --bg: #F3F6F4;
  --surface: #FFFFFF;
  --ink: #14201B;
  --muted: #5B6B63;
  --line: #D5DED9;
  --accent: #0B6A50;
  --accent-ink: #FFFFFF;
  --soft: #E3EFE9;
  --warn: #8F5400;
  --err: #B3261E;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1411; --surface: #151E1A; --ink: #E6EFEA; --muted: #93A59B; --line: #26332D;
    --accent: #4FC39A; --accent-ink: #06241A; --soft: #1B2A23; --warn: #E3A94F; --err: #F08A82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1411; --surface: #151E1A; --ink: #E6EFEA; --muted: #93A59B; --line: #26332D;
  --accent: #4FC39A; --accent-ink: #06241A; --soft: #1B2A23; --warn: #E3A94F; --err: #F08A82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; }
.wrap { max-width: 980px; margin-inline: auto; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.top-in { max-width: 980px; margin-inline: auto; }
.row { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 4.5vw, 30px); line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
.status { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.status[data-s="saving"] i { background: var(--warn); }
.status[data-s="err"] i { background: var(--err); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 22px 56px; display: flex; flex-direction: column; gap: 22px; }
.note { color: var(--muted); font-size: 13.5px; max-width: 68ch; margin: 0; }
.banner { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
section.card > h2 { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin: 0; line-height: 1.2; }
.src { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-weight: 400; margin-left: 8px; white-space: nowrap; }
.grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.grid .wide { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label.f > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
label.f > span small { font-weight: 400; display: block; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[type="checkbox"] { width: 18px; height: 18px; padding: 0; accent-color: var(--accent); flex: none; }
.chk { display: flex; gap: 9px; align-items: center; font-size: 14px; }
.chk span { min-width: 0; }
button.btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.btn.danger { background: transparent; color: var(--err); border: 1px solid var(--line); }
button.btn[data-armed] { background: var(--err); color: #fff; border-color: var(--err); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
/* Kartu bimbingan */
.card-rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.card-rows .hd, .card-rows .rw { display: grid; grid-template-columns: 34px 150px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 8px 10px; }
.card-rows .hd { background: var(--soft); font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.card-rows .rw { border-top: 1px solid var(--line); }
.card-rows .rw .no { font-family: var(--font-mono); color: var(--muted); }
@media (max-width: 640px) {
  .card-rows .hd { display: none; }
  .card-rows .rw { grid-template-columns: 28px minmax(0, 1fr); }
  .card-rows .rw > :nth-child(3), .card-rows .rw > :nth-child(4) { grid-column: 2; }
}
/* Skor */
.score { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px 14px; align-items: center; padding-block: 9px; border-top: 1px solid var(--line); }
.score:first-of-type { border-top: 0; }
@media (max-width: 560px) { .score { grid-template-columns: 1fr; } }
.result { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: baseline; padding: 12px 14px; border-radius: 8px; background: var(--soft); }
.result b { font-family: var(--font-mono); font-size: 24px; font-weight: 500; }
.result small { color: var(--muted); }
/* Ringkasan */
.prog { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-top: 1px solid var(--line); padding: 13px 2px; cursor: pointer; }
.prog:first-of-type { border-top: 0; }
.prog:hover .pl { text-decoration: underline; }
.pl { font-weight: 600; }
.pv { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); }
.prog small { grid-column: 1 / -1; color: var(--muted); }
/* Jurnal */
details.ent { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
details.ent > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; list-style-position: inside; }
details.ent > .body { padding: 6px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px; color: var(--muted); text-align: center; }
.sep { display: flex; gap: 10px; flex-wrap: wrap; }
.ckgrid { display: grid; gap: 10px 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.wt { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-left: 10px; }
.chk.w { align-items: flex-start; }
.chk.w .wt { align-self: center; }
textarea.out { font-family: var(--font-mono); font-size: 12px; min-height: 140px; }
@media (prefers-reduced-motion: no-preference) { .bar > div { transition: width .25s ease; } }
</style>

<div class="wrap">
  <header class="top"><div class="top-in">
    <div class="row">
      <div>
        <div class="eyebrow">PPL · Fakultas Tarbiyah dan Keguruan · UIT Lirboyo Kediri</div>
        <h1 id="ttl">Berkas PPL</h1>
      </div>
      <span class="status" id="status" data-s="ok" role="status"><i></i><span id="statusTxt">Memuat…</span></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Bagian berkas"></nav>
  </div></header>
  <main id="main"></main>
</div>

<script>
(function () {
  "use strict";

  /* ---------- state ---------- */
  var DEF = function () {
    return { profil: { tahun: "2026/2027" }, observasi: {}, bimbingan: { dpl: [], pamong: [] }, rpp: { items: [] }, nilai: {} };
  };
  var SECTIONS = ["profil", "observasi", "bimbingan", "rpp", "nilai"];
  var S = DEF();
  var store = { mode: "local", col: null };
  var tab = "ringkasan";
  var loaded = false;

  var TABS = [
    ["ringkasan", "Ringkasan"], ["profil", "Profil"], ["observasi", "Observasi"],
    ["bimbingan", "Bimbingan"], ["jurnal", "Jurnal & RPP"], ["nilai", "Penilaian"], ["laporan", "Laporan"]
  ];
  var PRODI = ["Pendidikan Agama Islam (PAI)", "Pendidikan Guru MI (PGMI)", "Pendidikan Islam Anak Usia Dini (PIAUD)",
    "Tadris Matematika", "Tadris Bahasa Inggris", "Tadris Bahasa Arab", "Tadris Bahasa Indonesia"];

  var KONDISI = [
    ["Kondisi sarana prasarana sekolah", "Gedung sekolah, perpustakaan, laboratorium, tempat ibadah, fasilitas KBM, dll"],
    ["Kondisi lingkungan sekolah", "Tamanisasi, kebersihan, kerapian, dll"],
    ["Kondisi manajerial sekolah", ""],
    ["Administrasi sekolah", ""],
    ["Potensi siswa", "Akademik (karya tulis ilmiah remaja, dll). Non akademik (seni, olah raga, dll)"],
    ["Potensi guru", "Akademik (karya tulis ilmiah guru, dll). Non akademik"],
    ["Potensi karyawan", ""],
    ["Interaksi sosial", "Hubungan guru-guru, guru-siswa, siswa-siswa, guru-pegawai tata usaha, dan hubungan sosial secara keseluruhan"],
    ["Tata tertib", "Untuk siswa, guru, pegawai lainnya"],
    ["Bimbingan", "Bimbingan belajar, bimbingan konseling, dll"],
    ["Ekstrakurikuler", "Pramuka, PMI, basket, dll"],
    ["Organisasi sekolah", "OSIS, UKS, dll"],
    ["Koperasi siswa", ""]
  ];
  var KBM = [
    ["A. Kegiatan pendahuluan / pembuka", "a", [
      "Ketika masuk kelas, apa yang dikerjakan guru?",
      "Dengan cara apa guru membuka pelajaran?",
      "Apakah cara membuka pelajaran tersebut sesuai dengan materi yang akan disajikan? Berikan alasannya.",
      "Bagaimana cara guru menerapkan tes diagnostik?",
      "Berapa menit tahap pendahuluan ini berlangsung?",
      "Bagaimana perhatian siswa terhadap guru?"]],
    ["B. Kegiatan inti", "b", [
      "Bagaimana cara guru menyampaikan materi pokok pelajaran?",
      "Selama pelajaran berlangsung, berapa kali guru bertanya kepada siswa?",
      "Berapa orang siswa yang mendapat kesempatan menjawab pertanyaan guru?",
      "Selama pelajaran berlangsung: apakah ada siswa mengajukan pertanyaan? Siswa yang kesulitan belajar dan bagaimana guru membantunya? Siswa yang mengganggu kelas dan bagaimana guru mengatasinya?",
      "Secara umum, bagaimana perhatian siswa terhadap pelajaran yang disajikan guru / aktivitas belajar siswa?",
      "Berapa lama pelajaran inti ini berlangsung?"]],
    ["C. Penutup", "c", [
      "Apa yang dilakukan guru untuk mengakhiri pelajaran?",
      "Bagaimana cara guru menilai hasil belajar siswa?",
      "Bagaimana guru melakukan refleksi pembelajaran?",
      "Apa yang dilakukan guru sebelum mengakhiri pelajaran untuk pindah ke pelajaran lain atau istirahat?",
      "Berapa menit bagian penutup ini berlangsung?"]]
  ];
  var N3 = ["Kewibawaan sebagai pribadi calon guru", "Kearifan dalam mengambil keputusan", "Menjadi contoh dalam bersikap dan berperilaku",
    "Kesesuaian kata dan tindakan", "Kemampuan mengendalikan diri dalam berbagai situasi dan kondisi", "Kedisiplinan", "Kesopanan dan kelancaran berkomunikasi"];
  var N4 = ["Kemampuan menyampaikan pendapat", "Kemampuan menerima kritik, saran, dan pendapat orang lain",
    "Mudah bergaul di kalangan sesama praktikan dan civitas madrasah/sekolah", "Kerja sama dalam kelompok / teman praktikan dan civitas madrasah/sekolah",
    "Toleransi terhadap keberagaman di madrasah/sekolah"];
  var N5 = ["Keterlibatan piket guru", "Keterlibatan pengelolaan perpustakaan", "Keterlibatan dalam P5", "Keterlibatan aktivitas administrasi TU", "Keterlibatan aktivitas BK"];
  var NH_PARTS = [
    ["pembekalan", "Pembekalan dan laporan observasi"], ["pelaksanaan", "Pelaksanaan PPL (guru pamong)"],
    ["ujian", "Ujian praktik mengajar"], ["laporan", "Laporan PPL berbasis pembelajaran mendalam"], ["video", "Video PPL (kelompok)"]];
  var LAPORAN = [
    ["Bab I Pendahuluan", [["a1", "Latar belakang", 5], ["a2", "Tujuan PPL", 3], ["a3", "Manfaat PPL", 2]]],
    ["Bab II Pelaksanaan PPL berbasis pembelajaran mendalam", [["b1", "Dokumentasi (foto) praktik mengajar, minimal 3 pertemuan", 10], ["b2", "Laporan pelaksanaan dan evaluasi", 40]]],
    ["Bab III Kesimpulan dan saran", [["c1", "Kesimpulan", 5], ["c2", "Saran", 3], ["c3", "Daftar pustaka", 2], ["c4", "Lampiran (perencanaan pembelajaran dll)", 30]]]
  ];
  var ARTIKEL = [["Judul dan abstrak", 10], ["Pendahuluan", 15], ["Kajian pustaka dan landasan teori", 15], ["Metode penelitian", 15],
    ["Hasil dan pembahasan", 20], ["Kesimpulan dan implikasi", 10], ["Kebaruan dan kontribusi", 5], ["Tata tulis dan etika penulisan", 10]];
  var SKALA = [["", "Pilih…"], ["5", "5 · Sangat baik"], ["4", "4 · Baik"], ["3", "3 · Cukup"], ["2", "2 · Kurang"], ["1", "1 · Sangat kurang"]];

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function getp(p) { return p.split(".").reduce(function (o, k) { return o == null ? undefined : o[k]; }, S); }
  function setp(p, v) {
    var ks = p.split("."), o = S;
    for (var i = 0; i < ks.length - 1; i++) {
      var k = ks[i];
      if (o[k] == null || typeof o[k] !== "object") o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      o = o[k];
    }
    o[ks[ks.length - 1]] = v;
  }
  function num(v) { var n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isNaN(n) ? null : n; }
  function fmt(n, d) { return n == null ? "—" : n.toFixed(d == null ? 1 : d).replace(".", ","); }
  function filled(v) { return v != null && String(v).trim() !== ""; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function pid(p) { return "f_" + p.replace(/\./g, "_"); }

  function field(path, label, o) {
    o = o || {};
    var v = getp(path); if (v == null) v = "";
    var id = pid(path), c;
    if (o.ta) c = '<textarea id="' + id + '" data-k="' + path + '" rows="' + (o.rows || 3) + '" placeholder="' + esc(o.ph || "") + '">' + esc(v) + "</textarea>";
    else if (o.options) c = '<select id="' + id + '" data-k="' + path + '"' + (o.attrs ? " " + o.attrs : "") + '>' + o.options.map(function (op) {
      var val = Array.isArray(op) ? op[0] : op, lab = Array.isArray(op) ? op[1] : op;
      return '<option value="' + esc(val) + '"' + (String(v) === String(val) ? " selected" : "") + ">" + esc(lab) + "</option>";
    }).join("") + "</select>";
    else c = '<input id="' + id + '" data-k="' + path + '" type="' + (o.type || "text") + '" value="' + esc(v) + '" placeholder="' + esc(o.ph || "") + '"' + (o.attrs ? " " + o.attrs : "") + ">";
    return '<label class="f ' + (o.cls || "") + '" for="' + id + '"><span>' + label + (o.hint ? "<small>" + esc(o.hint) + "</small>" : "") + "</span>" + c + "</label>";
  }
  function check(path, label, extra) {
    var id = pid(path);
    return '<label class="chk' + (extra ? " w" : "") + '" for="' + id + '"><input id="' + id + '" type="checkbox" data-k="' + path + '"' + (getp(path) ? " checked" : "") + "><span>" + label + "</span>" + (extra || "") + "</label>";
  }

  /* ---------- storage ---------- */
  var dirty = {}, timers = {}, chains = {};
  function setStatus(s, t) {
    var el = document.getElementById("status"); if (!el) return;
    el.setAttribute("data-s", s);
    document.getElementById("statusTxt").textContent = t || ({ ok: store.mode === "db" ? "Tersimpan" : "Tersimpan di browser ini", saving: "Menyimpan…", err: "Belum tersimpan" })[s];
  }
  function localSave() { try { localStorage.setItem("ppl-uit-lirboyo", JSON.stringify(S)); } catch (e) { throw e; } }
  function touch(sec) { dirty[sec] = true; setStatus("saving"); clearTimeout(timers[sec]); timers[sec] = setTimeout(function () { flush(sec); }, 700); }
  function flush(sec) {
    if (!dirty[sec]) return chains[sec] || Promise.resolve();
    dirty[sec] = false; clearTimeout(timers[sec]);
    var snap = clone(S[sec]);
    chains[sec] = (chains[sec] || Promise.resolve()).then(function () {
      return store.mode === "db" ? store.col.doc(sec).set(snap) : localSave();
    }).then(function () {
      var pending = SECTIONS.some(function (s) { return dirty[s]; });
      if (!pending) setStatus("ok");
    }, function () { dirty[sec] = true; setStatus("err"); });
    return chains[sec];
  }
  function flushAll() { SECTIONS.forEach(function (s) { if (dirty[s]) flush(s); }); }

  function normalize() {
    ["dpl", "pamong"].forEach(function (k) {
      if (!Array.isArray(S.bimbingan[k])) S.bimbingan[k] = [];
      while (S.bimbingan[k].length < 10) S.bimbingan[k].push({});
    });
    if (!Array.isArray(S.rpp.items)) S.rpp.items = [];
    if (!S.profil.tahun) S.profil.tahun = "2026/2027";
  }

  async function initStore() {
    try {
      if (window.claude && window.claude.use) {
        var res = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        var db = res[0], user = res[1];
        if (db && user) {
          var uid = await user.id();
          if (uid) {
            store = { mode: "db", col: db.collection("data/users/" + uid) };
            await Promise.all(SECTIONS.map(async function (s) {
              var d = await store.col.doc(s).get();
              if (d.exists) S[s] = Object.assign(S[s], clone(d.data()));
            }));
            return;
          }
        }
      }
    } catch (e) { /* fall through to local */ }
    store = { mode: "local", col: null };
    try { var raw = localStorage.getItem("ppl-uit-lirboyo"); if (raw) { var o = JSON.parse(raw); SECTIONS.forEach(function (s) { if (o[s]) S[s] = Object.assign(S[s], o[s]); }); } } catch (e) { /* empty */ }
  }

  /* ---------- views ---------- */
  var views = {};

  views.profil = function () {
    return '<section class="card"><h2>Identitas praktikan</h2><div class="grid">' +
      field("profil.nama", "Nama mahasiswa", { ph: "Nama lengkap" }) +
      field("profil.npm", "NPM / NIM", { ph: "mis. 210109566", attrs: 'inputmode="numeric"' }) +
      field("profil.prodi", "Program studi", { options: [["", "Pilih program studi…"]].concat(PRODI) }) +
      field("profil.tahun", "Tahun akademik") +
      "</div></section>" +
      '<section class="card"><h2>Lokasi dan pembimbing</h2><div class="grid">' +
      field("profil.lokasi", "Lokasi PPL (madrasah / sekolah)", { ph: "mis. MA Al-Mahrusiyah Pusat", cls: "wide" }) +
      field("profil.dpl", "Dosen Pembimbing Lapangan (DPL)") +
      field("profil.pamong", "Guru pamong") +
      field("profil.kepsek", "Kepala sekolah / madrasah") +
      field("profil.mapel", "Mata pelajaran yang diampu") +
      field("profil.kelas", "Kelas / fase yang diajar", { ph: "mis. X / Fase E" }) +
      field("profil.mulai", "Mulai PPL", { type: "date" }) +
      field("profil.selesai", "Selesai PPL", { type: "date" }) +
      "</div></section>";
  };

  views.observasi = function () {
    var kon = KONDISI.map(function (r, i) {
      return field("observasi.kondisi." + i, (i + 1) + ". " + esc(r[0]), { ta: true, rows: 2, hint: r[1], cls: "wide" });
    }).join("");
    var kbm = KBM.map(function (g) {
      return '<div class="wide"><h3 style="margin:6px 0 10px;font-size:15px">' + esc(g[0]) + "</h3><div class=\"grid\">" +
        g[2].map(function (q, i) { return field("observasi.kbm." + g[1] + i, (i + 1) + ". " + esc(q), { ta: true, rows: 2, cls: "wide" }); }).join("") + "</div></div>";
    }).join("");
    return '<p class="note">Isi catatan hasil observasi sebelum mengajar. Isian mengikuti format Lampiran 4 pada buku pedoman.</p>' +
      '<section class="card"><h2>Kondisi sekolah<span class="src">Lampiran 4 · bagian 1</span></h2><div class="grid">' +
      field("observasi.tgl", "Tanggal observasi", { type: "date" }) + "<div></div>" + kon + "</div></section>" +
      '<section class="card"><h2>Lembar observasi kegiatan belajar mengajar<span class="src">Lampiran 4 · bagian 3</span></h2>' +
      '<div class="grid">' + field("observasi.kbmKelas", "Kelas") + field("observasi.kbmJam", "Jam pelajaran") +
      field("observasi.kbmMapel", "Mata pelajaran") + field("observasi.kbmTgl", "Hari / tanggal", { type: "date" }) + "</div>" +
      kbm +
      '<div class="grid">' + field("observasi.kesan", "Kesan umum terhadap kegiatan belajar-mengajar yang diamati", { ta: true, rows: 4, cls: "wide" }) + "</div></section>";
  };

  function kartu(key, title, src, who) {
    var rows = "";
    for (var i = 0; i < 10; i++) {
      var b = "bimbingan." + key + "." + i;
      rows += '<div class="rw"><span class="no">' + (i + 1) + "</span>" +
        '<input type="date" aria-label="Tanggal bimbingan ' + (i + 1) + '" data-k="' + b + '.tgl" value="' + esc(getp(b + ".tgl")) + '">' +
        '<input type="text" aria-label="Materi bimbingan ' + (i + 1) + '" data-k="' + b + '.materi" placeholder="Materi bimbingan" value="' + esc(getp(b + ".materi")) + '">' +
        '<label class="chk"><input type="checkbox" data-k="' + b + '.ttd"' + (getp(b + ".ttd") ? " checked" : "") + "><span>TTD " + who + "</span></label></div>";
    }
    return '<section class="card"><h2>' + title + '<span class="src">' + src + "</span></h2>" +
      '<div class="card-rows"><div class="hd"><span>No</span><span>Tanggal</span><span>Materi bimbingan</span><span>Tanda tangan</span></div>' + rows + "</div></section>";
  }
  views.bimbingan = function () {
    return '<p class="note">Centang kolom tanda tangan setelah kartu fisik ditandatangani. Dua kartu, masing-masing 10 kali bimbingan.</p>' +
      kartu("dpl", "Bimbingan dengan dosen pembimbing", "Lampiran 16", "DPL") +
      kartu("pamong", "Bimbingan dengan guru pamong", "Lampiran 17", "pamong");
  };

  function rppEntry(it, i) {
    var p = "rpp.items." + i + ".";
    var head = "Pertemuan " + (it.ke || i + 1) + (it.mapel ? " · " + it.mapel : "") + (it.tgl ? " · " + it.tgl : "");
    return '<details class="ent"' + (i === S.rpp.items.length - 1 ? " open" : "") + "><summary>" + esc(head) + '</summary><div class="body">' +
      '<div class="grid">' +
      field(p + "ke", "Pertemuan ke-", { type: "number", attrs: 'min="1" inputmode="numeric"' }) +
      field(p + "tgl", "Tanggal", { type: "date" }) +
      field(p + "mapel", "Mata pelajaran") +
      field(p + "kelas", "Kelas / fase") +
      field(p + "materi", "Materi pokok", { cls: "wide" }) +
      field(p + "waktu", "Alokasi waktu", { ph: "mis. 2 JP x 35 menit" }) +
      "</div>" +
      '<div class="sep">' + check(p + "p1", "Berkesadaran") + check(p + "p2", "Bermakna") + check(p + "p3", "Menggembirakan") + "</div>" +
      field(p + "cp", "Capaian dan tujuan pembelajaran", { ta: true, rows: 3 }) +
      field(p + "awal", "Kegiatan pendahuluan", { ta: true, rows: 4 }) +
      field(p + "inti", "Kegiatan inti", { ta: true, rows: 6 }) +
      field(p + "akhir", "Kegiatan penutup", { ta: true, rows: 4 }) +
      field(p + "asesmen", "Asesmen (awal, formatif, sumatif)", { ta: true, rows: 3 }) +
      field(p + "refleksi", "Refleksi dan catatan setelah mengajar", { ta: true, rows: 3 }) +
      '<div><button type="button" class="btn danger" data-act="delrpp" data-i="' + i + '">Hapus pertemuan ini</button></div>' +
      "</div></details>";
  }
  views.jurnal = function () {
    var items = S.rpp.items;
    return '<p class="note">Satu entri untuk setiap pertemuan mengajar. Susunan mengikuti contoh RPP pembelajaran mendalam di buku pedoman: identifikasi, capaian dan tujuan, kegiatan awal, inti, penutup, serta asesmen.</p>' +
      '<section class="card"><h2>Pertemuan mengajar <span class="src">' + items.length + " entri</span></h2>" +
      (items.length ? items.map(rppEntry).join("") : '<div class="empty">Belum ada pertemuan. Tambahkan setelah RPP pertama disusun.</div>') +
      '<div><button type="button" class="btn" data-act="addrpp">Tambah pertemuan</button></div></section>';
  };

  function skorList(prefix, list) {
    return list.map(function (t, i) {
      return '<div class="score"><span>' + (i + 1) + ". " + esc(t) + "</span>" + field(prefix + "." + i, "", { options: SKALA, attrs: 'aria-label="' + esc(t) + '"' }).replace("<span></span>", "") + "</div>";
    }).join("");
  }
  views.nilai = function () {
    var n5 = N5.map(function (t, i) { return check("nilai.n5k." + i, esc(t)); }).join("");
    var nh = NH_PARTS.map(function (p) {
      return '<div class="score"><span>' + esc(p[1]) + "</span>" + field("nilai.nh." + p[0], "", { type: "number", attrs: 'min="0" max="100" step="any" inputmode="decimal" aria-label="' + esc(p[1]) + '"' }).replace("<span></span>", "") + "</div>";
    }).join("");
    return '<p class="note">Nilai diberikan oleh guru pamong dan dosen pembimbing. Halaman ini untuk mencatat dan menghitung hasilnya.</p>' +
      '<section class="card"><h2>Kompetensi kepribadian <span class="src">N3 · Lampiran 5C</span></h2>' + skorList("nilai.n3", N3) +
      '<div class="result"><b id="n3v">—</b><span id="n3t" class="note"></span></div></section>' +
      '<section class="card"><h2>Kompetensi sosial <span class="src">N4 · Lampiran 5D</span></h2>' + skorList("nilai.n4", N4) +
      '<div class="result"><b id="n4v">—</b><span id="n4t" class="note"></span></div></section>' +
      '<section class="card"><h2>Praktik persekolahan <span class="src">N5 · Lampiran 5E</span></h2>' +
      '<div class="ckgrid">' + n5 + "</div>" +
      '<div class="grid">' + field("nilai.n5", "Nilai akhir (0–100)", { type: "number", attrs: 'min="0" max="100" step="any" inputmode="decimal"' }) + "</div>" +
      '<div class="result"><span id="n5t" class="note"></span></div></section>' +
      '<section class="card"><h2>Nilai hasil PPL <span class="src">NH · Lampiran 8</span></h2>' +
      '<p class="note">NH adalah rata-rata kelima komponen. Daftar komponen mengikuti contoh perhitungan di buku pedoman.</p>' + nh +
      '<div class="result"><b id="nhv">—</b><span id="nht" class="note"></span></div></section>';
  };

  function weighted(prefix, items, startKey) {
    return items.map(function (r, i) {
      var key = startKey ? r[0] : i, label = startKey ? r[1] : r[0], w = startKey ? r[2] : r[1];
      return check("nilai." + prefix + "." + key, esc(label), '<span class="wt">' + w + " poin</span>");
    }).join("");
  }
  views.laporan = function () {
    var bab = LAPORAN.map(function (b) {
      return "<div><h3 style=\"margin:0 0 8px;font-size:15px\">" + esc(b[0]) + "</h3><div class=\"ckgrid\" style=\"grid-template-columns:1fr\">" + weighted("lap", b[1], true) + "</div></div>";
    }).join("");
    return '<p class="note">Centang bagian yang sudah selesai. Bobot diambil dari rubrik penilaian di buku pedoman, total 100 poin untuk masing-masing dokumen.</p>' +
      '<section class="card"><h2>Laporan PPL berbasis pembelajaran mendalam <span class="src">Lampiran 6</span></h2>' + bab +
      '<div class="result"><b id="lapv">—</b><span class="note">poin terpenuhi dari 100</span></div></section>' +
      '<section class="card"><h2>Draf artikel <span class="src">Lampiran 7</span></h2><div class="ckgrid" style="grid-template-columns:1fr">' + weighted("art", ARTIKEL, false) + "</div>" +
      '<div class="result"><b id="artv">—</b><span class="note">poin terpenuhi dari 100</span></div></section>';
  };

  /* ---------- computed ---------- */
  function sumList(prefix, n) {
    var t = 0, c = 0;
    for (var i = 0; i < n; i++) { var v = num(getp(prefix + "." + i)); if (v != null) { t += v; c++; } }
    return { total: t, count: c };
  }
  function pctWeights(prefix, items, startKey) {
    var t = 0;
    items.forEach(function (r, i) { var key = startKey ? r[0] : i, w = startKey ? r[2] : r[1]; if (getp("nilai." + prefix + "." + key)) t += w; });
    return t;
  }
  function nhCalc() {
    var vals = NH_PARTS.map(function (p) { return num(getp("nilai.nh." + p[0])); }).filter(function (v) { return v != null; });
    if (!vals.length) return null;
    return { avg: vals.reduce(function (a, b) { return a + b; }, 0) / vals.length, n: vals.length };
  }
  function n5Label(v) {
    if (v == null) return "";
    if (v >= 80) return "Melaksanakan semua kegiatan persekolahan dengan tertib dan sesuai aturan.";
    if (v >= 70) return "Melaksanakan semua kegiatan persekolahan dengan kurang tertib.";
    if (v >= 60) return "Melaksanakan sebagian kegiatan persekolahan.";
    return "Kurang melaksanakan kegiatan persekolahan.";
  }
  function setText(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }
  function refreshComputed() {
    var a = sumList("nilai.n3", 7);
    setText("n3v", a.count === 7 ? fmt(a.total / 35 * 100) : "—");
    setText("n3t", a.count === 7 ? "Total skor " + a.total + " dari 35, dikali 100." : a.count + " dari 7 indikator terisi.");
    var b = sumList("nilai.n4", 5);
    setText("n4v", b.count === 5 ? fmt(b.total / 25 * 100) : "—");
    setText("n4t", b.count === 5 ? "Total skor " + b.total + " dari 25, dikali 100." : b.count + " dari 5 indikator terisi.");
    setText("n5t", n5Label(num(getp("nilai.n5"))) || "Isi nilai akhir untuk melihat keterangannya.");
    var h = nhCalc();
    setText("nhv", h ? fmt(h.avg) : "—");
    setText("nht", h ? (h.n === 5 ? "Rata-rata dari 5 komponen." : "Sementara, baru " + h.n + " dari 5 komponen terisi.") : "");
    setText("lapv", String(pctWeights("lap", [].concat.apply([], LAPORAN.map(function (b) { return b[1]; })), true)));
    setText("artv", String(pctWeights("art", ARTIKEL, false)));
  }

  views.ringkasan = function () {
    var P = S.profil;
    var prof = ["nama", "npm", "prodi", "tahun", "lokasi", "dpl", "pamong", "kepsek"].filter(function (k) { return filled(P[k]); }).length;
    var ko = 0; KONDISI.forEach(function (_, i) { if (filled(getp("observasi.kondisi." + i))) ko++; });
    var kb = 0, kbTot = 0; KBM.forEach(function (g) { g[2].forEach(function (_, i) { kbTot++; if (filled(getp("observasi.kbm." + g[1] + i))) kb++; }); });
    function cnt(k) { return S.bimbingan[k].filter(function (r) { return filled(r.tgl) && filled(r.materi); }).length; }
    function ttd(k) { return S.bimbingan[k].filter(function (r) { return r.ttd; }).length; }
    var lap = pctWeights("lap", [].concat.apply([], LAPORAN.map(function (b) { return b[1]; })), true);
    var art = pctWeights("art", ARTIKEL, false);
    var h = nhCalc();
    var rows = [
      ["profil", "Profil dan lokasi PPL", prof, 8, prof + " dari 8 isian"],
      ["observasi", "Observasi kondisi sekolah", ko, KONDISI.length, ko + " dari " + KONDISI.length + " aspek"],
      ["observasi", "Observasi kegiatan belajar-mengajar", kb, kbTot, kb + " dari " + kbTot + " pertanyaan"],
      ["bimbingan", "Kartu bimbingan DPL", cnt("dpl"), 10, cnt("dpl") + " dari 10 sesi dicatat, " + ttd("dpl") + " bertanda tangan"],
      ["bimbingan", "Kartu bimbingan guru pamong", cnt("pamong"), 10, cnt("pamong") + " dari 10 sesi dicatat, " + ttd("pamong") + " bertanda tangan"],
      ["jurnal", "Jurnal dan RPP pertemuan", S.rpp.items.length, Math.max(3, S.rpp.items.length), S.rpp.items.length + " pertemuan. Laporan mensyaratkan dokumentasi minimal 3 pertemuan."],
      ["laporan", "Kelengkapan laporan PPL", lap, 100, lap + " dari 100 poin"],
      ["laporan", "Kelengkapan draf artikel", art, 100, art + " dari 100 poin"],
      ["nilai", "Nilai hasil PPL (NH)", h ? h.n : 0, 5, h ? "NH " + fmt(h.avg) + (h.n < 5 ? " (sementara)" : "") : "Belum ada komponen nilai"]
    ];
    return '<section class="card"><h2>Yang sudah dan belum terisi</h2><div>' + rows.map(function (r) {
      var pct = r[3] ? Math.min(100, Math.round(r[2] / r[3] * 100)) : 0;
      return '<button type="button" class="prog" data-go="' + r[0] + '"><span class="pl">' + esc(r[1]) + '</span><span class="pv">' + pct + '%</span><div class="bar"><div style="width:' + pct + '%"></div></div><small>' + esc(r[4]) + "</small></button>";
    }).join("") + "</div></section>" +
      '<section class="card"><h2>Cadangan data</h2><p class="note">Data tersimpan otomatis. Salin sebagai teks bila ingin menyimpan cadangan sendiri.</p>' +
      '<div><button type="button" class="btn ghost" data-act="copy">Salin semua data</button></div><div id="copyOut"></div></section>';
  };

  /* ---------- render + events ---------- */
  function render() {
    var nav = document.getElementById("tabs");
    nav.innerHTML = TABS.map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + "</button>";
    }).join("");
    var banner = loaded && store.mode === "local" ? '<div class="banner">Anda belum masuk ke akun. Data hanya tersimpan di browser ini dan bisa hilang bila data situs dibersihkan.</div>' : "";
    document.getElementById("main").innerHTML = banner + views[tab]();
    document.getElementById("ttl").textContent = S.profil.nama ? "Berkas PPL " + S.profil.nama : "Berkas PPL";
    refreshComputed();
  }
  function go(t) { tab = t; render(); window.scrollTo(0, 0); }

  document.addEventListener("input", function (e) {
    var el = e.target.closest ? e.target.closest("[data-k]") : null; if (!el) return;
    var p = el.getAttribute("data-k");
    setp(p, el.type === "checkbox" ? el.checked : el.value);
    touch(p.split(".")[0]);
    refreshComputed();
    if (p === "profil.nama") document.getElementById("ttl").textContent = el.value ? "Berkas PPL " + el.value : "Berkas PPL";
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-tab],[data-go],[data-act]") : null; if (!t) return;
    if (t.dataset.tab) return go(t.dataset.tab);
    if (t.dataset.go) return go(t.dataset.go === "observasi" || t.dataset.go === "bimbingan" || t.dataset.go === "jurnal" || t.dataset.go === "nilai" || t.dataset.go === "laporan" || t.dataset.go === "profil" ? t.dataset.go : "ringkasan");
    var act = t.dataset.act;
    if (act === "addrpp") {
      S.rpp.items.push({ ke: String(S.rpp.items.length + 1) }); touch("rpp"); render();
      var ds = document.querySelectorAll("details.ent"); if (ds.length) ds[ds.length - 1].scrollIntoView({ block: "start" });
    } else if (act === "delrpp") {
      if (!t.hasAttribute("data-armed")) {
        t.setAttribute("data-armed", "1"); t.textContent = "Klik lagi untuk menghapus";
        setTimeout(function () { if (t.isConnected) { t.removeAttribute("data-armed"); t.textContent = "Hapus pertemuan ini"; } }, 3000);
      } else { S.rpp.items.splice(parseInt(t.dataset.i, 10), 1); touch("rpp"); render(); }
    } else if (act === "copy") {
      var txt = JSON.stringify(S, null, 2), out = document.getElementById("copyOut");
      var show = function () { out.innerHTML = '<textarea class="out" readonly aria-label="Data lengkap">' + esc(txt) + "</textarea>"; var ta = out.firstChild; ta.focus(); ta.select(); };
      try { navigator.clipboard.writeText(txt).then(function () { out.innerHTML = '<p class="note">Data disalin ke clipboard.</p>'; }, show); } catch (err) { show(); }
    }
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) flushAll(); });
  window.addEventListener("pagehide", flushAll);

  /* ---------- boot ---------- */
  normalize(); render();
  initStore().then(function () { loaded = true; normalize(); render(); setStatus("ok"); }, function () { loaded = true; render(); setStatus("ok"); });
})();
</script>
