<style>
/* Layout: sticky header + scrollable tab strip, one working column. Form-first, summary tab shows what is still empty. */
:root {
  --bg: #F3F6F4;
  --surface: #FFFFFF;
  --ink: #14201B;
  --muted: #5B6B63;
  --line: #D5DED9;
  --accent: #0B6A50;
  --accent-ink: #FFFFFF;
  --soft: #E3EFE9;
  --warn: #8F5400;
  --err: #B3261E;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1411; --surface: #151E1A; --ink: #E6EFEA; --muted: #93A59B; --line: #26332D;
    --accent: #4FC39A; --accent-ink: #06241A; --soft: #1B2A23; --warn: #E3A94F; --err: #F08A82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1411; --surface: #151E1A; --ink: #E6EFEA; --muted: #93A59B; --line: #26332D;
  --accent: #4FC39A; --accent-ink: #06241A; --soft: #1B2A23; --warn: #E3A94F; --err: #F08A82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; }
.wrap { max-width: 980px; margin-inline: auto; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.top-in { max-width: 980px; margin-inline: auto; }
.row { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 4.5vw, 30px); line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
.status { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.status[data-s="saving"] i { background: var(--warn); }
.status[data-s="err"] i { background: var(--err); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 22px 56px; display: flex; flex-direction: column; gap: 22px; }
.note { color: var(--muted); font-size: 13.5px; max-width: 68ch; margin: 0; }
.banner { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
section.card > h2 { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin: 0; line-height: 1.2; }
.src { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-weight: 400; margin-left: 8px; white-space: nowrap; }
.grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.grid .wide { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label.f > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
label.f > span small { font-weight: 400; display: block; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[type="checkbox"] { width: 18px; height: 18px; padding: 0; accent-color: var(--accent); flex: none; }
.chk { display: flex; gap: 9px; align-items: center; font-size: 14px; }
.chk span { min-width: 0; }
button.btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.btn.danger { background: transparent; color: var(--err); border: 1px solid var(--line); }
button.btn[data-armed] { background: var(--err); color: #fff; border-color: var(--err); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
/* Kartu bimbingan */
.card-rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.card-rows .hd, .card-rows .rw { display: grid; grid-template-columns: 34px 150px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 8px 10px; }
.card-rows .hd { background: var(--soft); font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.card-rows .rw { border-top: 1px solid var(--line); }
.card-rows .rw .no { font-family: var(--font-mono); color: var(--muted); }
@media (max-width: 640px) {
  .card-rows .hd { display: none; }
  .card-rows .rw { grid-template-columns: 28px minmax(0, 1fr); }
  .card-rows .rw > :nth-child(3), .card-rows .rw > :nth-child(4) { grid-column: 2; }
}
/* Skor */
.score { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px 14px; align-items: center; padding-block: 9px; border-top: 1px solid var(--line); }
.score:first-of-type { border-top: 0; }
@media (max-width: 560px) { .score { grid-template-columns: 1fr; } }
.result { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: baseline; padding: 12px 14px; border-radius: 8px; background: var(--soft); }
.result b { font-family: var(--font-mono); font-size: 24px; font-weight: 500; }
.result small { color: var(--muted); }
/* Ringkasan */
.prog { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-top: 1px solid var(--line); padding: 13px 2px; cursor: pointer; }
.prog:first-of-type { border-top: 0; }
.prog:hover .pl { text-decoration: underline; }
.pl { font-weight: 600; }
.pv { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); }
.prog small { grid-column: 1 / -1; color: var(--muted); }
/* Jurnal */
details.ent { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
details.ent > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; list-style-position: inside; }
details.ent > .body { padding: 6px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px; color: var(--muted); text-align: center; }
.sep { display: flex; gap: 10px; flex-wrap: wrap; }
.ckgrid { display: grid; gap: 10px 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.wt { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-left: 10px; }
.chk.w { align-items: flex-start; }
.chk.w .wt { align-self: center; }
textarea.out { font-family: var(--font-mono); font-size: 12px; min-height: 140px; }
@media (prefers-reduced-motion: no-preference) { .bar > div { transition: width .25s ease; } }
</style>

<div class="wrap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- state ---------- */
  var DEF = function () {
    return { profil: { tahun: "2026/2027" }, observasi: {}, bimbingan: { dpl: [], pamong: [] }, rpp: { items: [] }, nilai: {} };
  };
  var SECTIONS = ["profil", "observasi", "bimbingan", "rpp", "nilai"];
  var S = DEF();
  var store = { mode: "local", col: null };
  var tab = "ringkasan";
  var loaded = false;
  var dl = null;

  var TABS = [
    ["ringkasan", "Ringkasan"], ["profil", "Profil"], ["observasi", "Observasi"],
    ["bimbingan", "Bimbingan"], ["jurnal", "Jurnal & RPP"], ["nilai", "Penilaian"], ["laporan", "Laporan"]
  ];
  var PRODI = ["Pendidikan Agama Islam (PAI)", "Pendidikan Guru MI (PGMI)", "Pendidikan Islam Anak Usia Dini (PIAUD)",
    "Tadris Matematika", "Tadris Bahasa Inggris", "Tadris Bahasa Arab", "Tadris Bahasa Indonesia"];

  var KONDISI = [
    ["Kondisi sarana prasarana sekolah", "Gedung sekolah, perpustakaan, laboratorium, tempat ibadah, fasilitas KBM, dll"],
    ["Kondisi lingkungan sekolah", "Tamanisasi, kebersihan, kerapian, dll"],
    ["Kondisi manajerial sekolah", "Cara sekolah dikelola: struktur organisasi, peran kepala sekolah, rapat guru"],
    ["Administrasi sekolah", "Kelengkapan arsip, data siswa, surat-menyurat. Tanyakan ke bagian TU"],
    ["Potensi siswa", "Akademik (karya tulis ilmiah remaja, dll). Non akademik (seni, olah raga, dll)"],
    ["Potensi guru", "Akademik (karya tulis ilmiah guru, dll). Non akademik"],
    ["Potensi karyawan", "Jumlah dan keahlian tenaga kependidikan seperti TU dan petugas lain"],
    ["Interaksi sosial", "Hubungan guru-guru, guru-siswa, siswa-siswa, guru-pegawai tata usaha, dan hubungan sosial secara keseluruhan"],
    ["Tata tertib", "Untuk siswa, guru, pegawai lainnya"],
    ["Bimbingan", "Bimbingan belajar, bimbingan konseling, dll"],
    ["Ekstrakurikuler", "Pramuka, PMI, basket, dll"],
    ["Organisasi sekolah", "OSIS, UKS, dll"],
    ["Koperasi siswa", "Ada atau tidaknya, kegiatannya, dan siapa pengelolanya"]
  ];
  var KBM = [
    ["A. Kegiatan pendahuluan / pembuka", "a", [
      "Ketika masuk kelas, apa yang dikerjakan guru?",
      "Dengan cara apa guru membuka pelajaran?",
      "Apakah cara membuka pelajaran tersebut sesuai dengan materi yang akan disajikan? Berikan alasannya.",
      "Bagaimana cara guru menerapkan tes diagnostik?",
      "Berapa menit tahap pendahuluan ini berlangsung?",
      "Bagaimana perhatian siswa terhadap guru?"]],
    ["B. Kegiatan inti", "b", [
      "Bagaimana cara guru menyampaikan materi pokok pelajaran?",
      "Selama pelajaran berlangsung, berapa kali guru bertanya kepada siswa?",
      "Berapa orang siswa yang mendapat kesempatan menjawab pertanyaan guru?",
      "Selama pelajaran berlangsung: apakah ada siswa mengajukan pertanyaan? Siswa yang kesulitan belajar dan bagaimana guru membantunya? Siswa yang mengganggu kelas dan bagaimana guru mengatasinya?",
      "Secara umum, bagaimana perhatian siswa terhadap pelajaran yang disajikan guru / aktivitas belajar siswa?",
      "Berapa lama pelajaran inti ini berlangsung?"]],
    ["C. Penutup", "c", [
      "Apa yang dilakukan guru untuk mengakhiri pelajaran?",
      "Bagaimana cara guru menilai hasil belajar siswa?",
      "Bagaimana guru melakukan refleksi pembelajaran?",
      "Apa yang dilakukan guru sebelum mengakhiri pelajaran untuk pindah ke pelajaran lain atau istirahat?",
      "Berapa menit bagian penutup ini berlangsung?"]]
  ];
  var N3 = ["Kewibawaan sebagai pribadi calon guru", "Kearifan dalam mengambil keputusan", "Menjadi contoh dalam bersikap dan berperilaku",
    "Kesesuaian kata dan tindakan", "Kemampuan mengendalikan diri dalam berbagai situasi dan kondisi", "Kedisiplinan", "Kesopanan dan kelancaran berkomunikasi"];
  var N4 = ["Kemampuan menyampaikan pendapat", "Kemampuan menerima kritik, saran, dan pendapat orang lain",
    "Mudah bergaul di kalangan sesama praktikan dan civitas madrasah/sekolah", "Kerja sama dalam kelompok / teman praktikan dan civitas madrasah/sekolah",
    "Toleransi terhadap keberagaman di madrasah/sekolah"];
  var N5 = ["Keterlibatan piket guru", "Keterlibatan pengelolaan perpustakaan", "Keterlibatan dalam P5", "Keterlibatan aktivitas administrasi TU", "Keterlibatan aktivitas BK"];
  var NH_PARTS = [
    ["pembekalan", "Pembekalan dan laporan observasi"], ["pelaksanaan", "Pelaksanaan PPL (guru pamong)"],
    ["ujian", "Ujian praktik mengajar"], ["laporan", "Laporan PPL berbasis pembelajaran mendalam"], ["video", "Video PPL (kelompok)"]];
  var LAPORAN = [
    ["Bab I Pendahuluan", [["a1", "Latar belakang", 5], ["a2", "Tujuan PPL", 3], ["a3", "Manfaat PPL", 2]]],
    ["Bab II Pelaksanaan PPL berbasis pembelajaran mendalam", [["b1", "Dokumentasi (foto) praktik mengajar, minimal 3 pertemuan", 10], ["b2", "Laporan pelaksanaan dan evaluasi", 40]]],
    ["Bab III Kesimpulan dan saran", [["c1", "Kesimpulan", 5], ["c2", "Saran", 3], ["c3", "Daftar pustaka", 2], ["c4", "Lampiran (perencanaan pembelajaran dll)", 30]]]
  ];
  var ARTIKEL = [["Judul dan abstrak", 10], ["Pendahuluan", 15], ["Kajian pustaka dan landasan teori", 15], ["Metode penelitian", 15],
    ["Hasil dan pembahasan", 20], ["Kesimpulan dan implikasi", 10], ["Kebaruan dan kontribusi", 5], ["Tata tulis dan etika penulisan", 10]];
  var SKALA = [["", "Pilih…"], ["5", "5 · Sangat baik"], ["4", "4 · Baik"], ["3", "3 · Cukup"], ["2", "2 · Kurang"], ["1", "1 · Sangat kurang"]];

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function getp(p) { return p.split(".").reduce(function (o, k) { return o == null ? undefined : o[k]; }, S); }
  function setp(p, v) {
    var ks = p.split("."), o = S;
    for (var i = 0; i < ks.length - 1; i++) {
      var k = ks[i];
      if (o[k] == null || typeof o[k] !== "object") o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      o = o[k];
    }
    o[ks[ks.length - 1]] = v;
  }
  function num(v) { var n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isNaN(n) ? null : n; }
  function fmt(n, d) { return n == null ? "—" : n.toFixed(d == null ? 1 : d).replace(".", ","); }
  function filled(v) { return v != null && String(v).trim() !== ""; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function pid(p) { return "f_" + p.replace(/\./g, "_"); }

  function field(path, label, o) {
    o = o || {};
    var v = getp(path); if (v == null) v = "";
    var id = pid(path), c;
    if (o.ta) c = '<textarea id="' + id + '" data-k="' + path + '" rows="' + (o.rows || 3) + '" placeholder="' + esc(o.ph || "") + '">' + esc(v) + "</textarea>";
    else if (o.options) c = '<select id="' + id + '" data-k="' + path + '"' + (o.attrs ? " " + o.attrs : "") + '>' + o.options.map(function (op) {
      var val = Array.isArray(op) ? op[0] : op, lab = Array.isArray(op) ? op[1] : op;
      return '<option value="' + esc(val) + '"' + (String(v) === String(val) ? " selected" : "") + ">" + esc(lab) + "</option>";
    }).join("") + "</select>";
    else c = '<input id="' + id + '" data-k="' + path + '" type="' + (o.type || "text") + '" value="' + esc(v) + '" placeholder="' + esc(o.ph || "") + '"' + (o.attrs ? " " + o.attrs : "") + ">";
    return '<label class="f ' + (o.cls || "") + '" for="' + id + '"><span>' + label + (o.hint ? "<small>" + esc(o.hint) + "</small>" : "") + "</span>" + c + "</label>";
  }
  function check(path, label, extra) {
    var id = pid(path);
    return '<label class="chk' + (extra ? " w" : "") + '" for="' + id + '"><input id="' + id + '" type="checkbox" data-k="' + path + '"' + (getp(path) ? " checked" : "") + "><span>" + label + "</span>" + (extra || "") + "</label>";
  }

  /* ---------- storage ---------- */
  var dirty = {}, timers = {}, chains = {};
  function setStatus(s, t) {
    var el = document.getElementById("status"); if (!el) return;
    el.setAttribute("data-s", s);
    document.getElementById("statusTxt").textContent = t || ({ ok: store.mode === "db" ? "Tersimpan" : "Tersimpan di browser ini", saving: "Menyimpan…", err: "Belum tersimpan" })[s];
  }
  function localSave() { try { localStorage.setItem("ppl-uit-lirboyo", JSON.stringify(S)); } catch (e) { throw e; } }
  function touch(sec) { dirty[sec] = true; setStatus("saving"); clearTimeout(timers[sec]); timers[sec] = setTimeout(function () { flush(sec); }, 700); }
  function flush(sec) {
    if (!dirty[sec]) return chains[sec] || Promise.resolve();
    dirty[sec] = false; clearTimeout(timers[sec]);
    var snap = clone(S[sec]);
    chains[sec] = (chains[sec] || Promise.resolve()).then(function () {
      return store.mode === "db" ? store.col.doc(sec).set(snap) : localSave();
    }).then(function () {
      var pending = SECTIONS.some(function (s) { return dirty[s]; });
      if (!pending) setStatus("ok");
    }, function () { dirty[sec] = true; setStatus("err"); });
    return chains[sec];
  }
  function flushAll() { SECTIONS.forEach(function (s) { if (dirty[s]) flush(s); }); }

  function normalize() {
    ["dpl", "pamong"].forEach(function (k) {
      if (!Array.isArray(S.bimbingan[k])) S.bimbingan[k] = [];
      while (S.bimbingan[k].length < 10) S.bimbingan[k].push({});
    });
    if (!Array.isArray(S.rpp.items)) S.rpp.items = [];
    if (!S.profil.tahun) S.profil.tahun = "2026/2027";
  }

  async function initStore() {
    try {
      if (window.claude && window.claude.use) {
        try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
        var res = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        var db = res[0], user = res[1];
        if (db && user) {
          var uid = await user.id();
          if (uid) {
            store = { mode: "db", col: db.collection("data/users/" + uid) };
            await Promise.all(SECTIONS.map(async function (s) {
              var d = await store.col.doc(s).get();
              if (d.exists) S[s] = Object.assign(S[s], clone(d.data()));
            }));
            return;
          }
        }
      }
    } catch (e) { /* fall through to local */ }
    store = { mode: "local", col: null };
    try { var raw = localStorage.getItem("ppl-uit-lirboyo"); if (raw) { var o = JSON.parse(raw); SECTIONS.forEach(function (s) { if (o[s]) S[s] = Object.assign(S[s], o[s]); }); } } catch (e) { /* empty */ }
  }

  /* ---------- views ---------- */
  var views = {};

  views.profil = function () {
    return '<section class="card"><h2>Identitas praktikan</h2><div class="grid">' +
      field("profil.nama", "Nama mahasiswa", { ph: "Nama lengkap", hint: "Tulis sesuai KTM atau daftar peserta PPL." }) +
      field("profil.npm", "NPM / NIM", { ph: "mis. 210109566", attrs: 'inputmode="numeric"', hint: "Nomor pokok mahasiswa, lihat di KTM." }) +
      field("profil.prodi", "Program studi", { options: [["", "Pilih program studi…"]].concat(PRODI), hint: "Pilih prodi kamu. Daftar prodi ada di SK PPL (Lampiran 18)." }) +
      field("profil.tahun", "Tahun akademik", { hint: "Di buku pedoman tertulis 2026/2027." }) +
      "</div></section>" +
      '<section class="card"><h2>Lokasi dan pembimbing</h2><div class="grid">' +
      field("profil.lokasi", "Lokasi PPL (madrasah / sekolah)", { ph: "mis. MA Al-Mahrusiyah Pusat", cls: "wide", hint: "Nama tempat kamu ditempatkan. Cocokkan dengan daftar lokasi PPL di SK (Lampiran 18) atau surat penempatan." }) +

  /* ---------- PDF (ketentuan buku: A4, Times New Roman 12, spasi 1,5, margin kiri 4 cm, lainnya 3 cm) ---------- */
  var MM = { L: 40, R: 30, T: 30, B: 30, W: 140, H: 297 };
  var BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  function latin(t) {
    return String(t == null ? "" : t).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-")
      .replace(/…/g, "...").replace(/ /g, " ").replace(/\t/g, " ").replace(/[^\n\x20-\x7E¡-ÿ]+/g, "[teks non-Latin]");
  }
  function tgl(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); if (!m) return v || "";

  }
  function buildPdf() {
    var J = window.jspdf.jsPDF;
    var doc = new J({ unit: "mm", format: "a4", orientation: "portrait" });
    var LH = 12 * 1.5 / (72 / 25.4), y = MM.T, TL = 12 * 1.15 / (72 / 25.4), PAD = 1.6;
    doc.setFont("times", "normal"); doc.setFontSize(12); doc.setLineHeightFactor(1.15);
    doc.setDrawColor(0); doc.setLineWidth(0.2);

    function room(h) { if (y + h > MM.H - MM.B) { doc.addPage(); y = MM.T; } }
    function gap(n) { y += LH * (n == null ? 0.5 : n); }
    function line(text, o) {
      o = o || {};
      doc.setFont("times", o.bold ? "bold" : o.italic ? "italic" : "normal");
      var ind = o.indent || 0, w = MM.W - ind;
      var ls = doc.splitTextToSize(latin(text), w);
      ls.forEach(function (l) {
        room(LH);
        if (o.center) doc.text(l, MM.L + MM.W / 2, y + 4.7, { align: "center" }); else doc.text(l, MM.L + ind, y + 4.7);
        y += LH;
      });
    }
    function h1(t) { room(LH * 2); line(t, { bold: true, center: true }); }
    function h2(t) { gap(0.5); room(LH * 3); line(t, { bold: true }); }
    function h3(t) { room(LH * 2); line(t, { bold: true, indent: 4 }); }
    function kv(k, v) {
      var KW = 46;
      var ls = doc.splitTextToSize(latin(filled(v) ? v : "-"), MM.W - KW - 4);
      doc.setFont("times", "normal");
      ls.forEach(function (l, i) {
        room(LH);
        if (i === 0) { doc.text(latin(k), MM.L, y + 4.7); doc.text(":", MM.L + KW, y + 4.7); }
        doc.text(l, MM.L + KW + 4, y + 4.7);
        y += LH;
      });
    }
    function para(label, v) {
      line(label, { bold: true });
      line(filled(v) ? v : "-", { indent: 4 });
    }
    function table(heads, widths, rows, o) {
      o = o || {};
      function measure(cells, bold) {
        doc.setFont("times", bold ? "bold" : "normal");
        var max = 1, ls = cells.map(function (c, i) { var l = doc.splitTextToSize(latin(c), widths[i] - 2 * PAD); if (l.length > max) max = l.length; return l; });
        return { ls: ls, h: Math.max(max * TL + 2 * PAD, o.minH || 0) };
      }
      function row(cells, bold, fill, head) {
        var r = measure(cells, bold);
        if (y + r.h > MM.H - MM.B) { doc.addPage(); y = MM.T; if (!head) row(heads, true, true, true); r = measure(cells, bold); }
        var x = MM.L;
        doc.setFont("times", bold ? "bold" : "normal");
        r.ls.forEach(function (l, i) {
          if (fill) { doc.setFillColor(232, 232, 232); doc.rect(x, y, widths[i], r.h, "FD"); } else doc.rect(x, y, widths[i], r.h, "S");
          doc.text(l, x + PAD, y + PAD + 3.6);
          x += widths[i];
        });
        y += r.h;
      }
      row(heads, true, true, true);
      rows.forEach(function (r) { row(r, !!o.boldLast && r === rows[rows.length - 1], false, false); });
      y += 3;
    }

    var P = S.profil;
    /* judul */
    h1("BERKAS PRAKTIK PENGALAMAN LAPANGAN (PPL)");
    line("Fakultas Tarbiyah dan Keguruan", { center: true });
    line("Universitas Islam Tribakti Lirboyo Kediri", { center: true });
    line("Tahun Akademik " + (P.tahun || "2026/2027"), { center: true });
    gap(0.5);

    h2("A. Identitas Praktikan");
    kv("Nama", P.nama); kv("NPM", P.npm); kv("Program Studi", P.prodi); kv("Lokasi PPL", P.lokasi);
    kv("Dosen Pembimbing", P.dpl); kv("Guru Pamong", P.pamong); kv("Kepala Sekolah", P.kepsek);
    kv("Mata Pelajaran", P.mapel); kv("Kelas / Fase", P.kelas);
    kv("Masa PPL", (P.mulai || P.selesai) ? (tgl(P.mulai) || "-") + " s.d. " + (tgl(P.selesai) || "-") : "");

    /* observasi */
    h2("B. Hasil Observasi");
    h3("1. Kondisi Sekolah" + (S.observasi.tgl ? " (" + tgl(S.observasi.tgl) + ")" : ""));
    KONDISI.forEach(function (r, i) { para((i + 1) + ". " + r[0], getp("observasi.kondisi." + i)); });
    gap(0.3);
    h3("2. Observasi Kegiatan Belajar Mengajar");
    kv("Kelas", S.observasi.kbmKelas); kv("Jam Pelajaran", S.observasi.kbmJam);
    kv("Mata Pelajaran", S.observasi.kbmMapel); kv("Hari / Tanggal", tgl(S.observasi.kbmTgl));
    KBM.forEach(function (g) {
      gap(0.3); line(g[0], { bold: true });
      g[2].forEach(function (q, i) { line((i + 1) + ". " + q, { indent: 4 }); line(filled(getp("observasi.kbm." + g[1] + i)) ? getp("observasi.kbm." + g[1] + i) : "-", { indent: 8, italic: true }); });
    });
    gap(0.3); para("Kesan umum", S.observasi.kesan);

    /* kartu bimbingan */
    doc.addPage(); y = MM.T;
    h2("C. Kartu Bimbingan");
    [["dpl", "1. Bimbingan dengan Dosen Pembimbing", "Tanda tangan DPL"], ["pamong", "2. Bimbingan dengan Guru Pamong", "Tanda tangan guru pamong"]].forEach(function (c) {
      h3(c[1]); gap(0.2);
      var rows = S.bimbingan[c[0]].map(function (r, i) { return [String(i + 1), tgl(r.tgl), r.materi || "", r.ttd ? "Sudah" : ""]; });
      table(["No", "Tanggal", "Materi Bimbingan", c[2]], [10, 32, 62, 36], rows, { minH: 9 });
    });

    /* jurnal */
    doc.addPage(); y = MM.T;
    h2("D. Jurnal dan Rencana Pembelajaran");
    if (!S.rpp.items.length) line("Belum ada pertemuan yang dicatat.", { italic: true });
    S.rpp.items.forEach(function (it, i) {
      h3("Pertemuan ke-" + (it.ke || i + 1));
      kv("Tanggal", tgl(it.tgl)); kv("Mata Pelajaran", it.mapel); kv("Kelas / Fase", it.kelas);
      kv("Materi Pokok", it.materi); kv("Alokasi Waktu", it.waktu);
      kv("Prinsip", [it.p1 ? "Berkesadaran" : "", it.p2 ? "Bermakna" : "", it.p3 ? "Menggembirakan" : ""].filter(Boolean).join(", "));
      para("Capaian dan Tujuan Pembelajaran", it.cp); para("Kegiatan Pendahuluan", it.awal); para("Kegiatan Inti", it.inti);
      para("Kegiatan Penutup", it.akhir); para("Asesmen", it.asesmen); para("Refleksi", it.refleksi);
      gap(0.5);
    });

    /* penilaian */
    doc.addPage(); y = MM.T;
    h2("E. Penilaian");
    function skor(title, list, prefix, div) {
      h3(title); gap(0.2);
      var sc = sumList(prefix, list.length);
      var rows = list.map(function (t, i) { var v = getp(prefix + "." + i); return [String(i + 1), t, filled(v) ? String(v) : ""]; });
      rows.push(["", "Nilai (total skor / " + div + " x 100)", sc.count === list.length ? fmt(sc.total / div * 100) : "-"]);
      table(["No", "Indikator", "Skor"], [10, 106, 24], rows, { boldLast: true, minH: 8 });
    }
    skor("1. Kompetensi Kepribadian (N3)", N3, "nilai.n3", 35);
    skor("2. Kompetensi Sosial (N4)", N4, "nilai.n4", 25);
    h3("3. Praktik Persekolahan (N5)"); gap(0.2);
    var r5 = N5.map(function (t, i) { return [String(i + 1), t, getp("nilai.n5k." + i) ? "Ya" : "Belum"]; });
    r5.push(["", "Nilai akhir", filled(getp("nilai.n5")) ? String(getp("nilai.n5")) : "-"]);
    table(["No", "Kegiatan Persekolahan", "Checklist"], [10, 106, 24], r5, { boldLast: true, minH: 8 });
    var k5 = n5Label(num(getp("nilai.n5"))); if (k5) { line("Keterangan: " + k5, { indent: 0 }); gap(0.3); }
    h3("4. Nilai Hasil PPL (NH)"); gap(0.2);
    var nh = nhCalc();
    var rn = NH_PARTS.map(function (q, i) { var v = getp("nilai.nh." + q[0]); return [String(i + 1), q[1], filled(v) ? String(v) : "-"]; });
    rn.push(["", "Nilai Hasil (rata-rata)" + (nh && nh.n < 5 ? ", sementara" : ""), nh ? fmt(nh.avg) : "-"]);
    table(["No", "Komponen", "Nilai"], [10, 106, 24], rn, { boldLast: true, minH: 8 });

    /* kelengkapan */
    h2("F. Kelengkapan Dokumen");
    h3("1. Laporan PPL"); gap(0.2);
    var rl = [];
    LAPORAN.forEach(function (b) { b[1].forEach(function (r) { rl.push([b[0] === LAPORAN[0][0] ? "Bab I" : b[0].indexOf("Bab II ") === 0 ? "Bab II" : "Bab III", r[1], String(r[2]), getp("nilai.lap." + r[0]) ? "Sudah" : "Belum"]); }); });
    table(["Bab", "Bagian", "Poin", "Status"], [20, 80, 16, 24], rl, { minH: 8 });
    line("Poin terpenuhi: " + pctWeights("lap", [].concat.apply([], LAPORAN.map(function (b) { return b[1]; })), true) + " dari 100", { bold: true }); gap(0.3);
    h3("2. Draf Artikel"); gap(0.2);
    var ra = ARTIKEL.map(function (r, i) { return [String(i + 1), r[0], String(r[1]), getp("nilai.art." + i) ? "Sudah" : "Belum"]; });
    table(["No", "Aspek", "Poin", "Status"], [10, 90, 16, 24], ra, { minH: 8 });
    line("Poin terpenuhi: " + pctWeights("art", ARTIKEL, false) + " dari 100", { bold: true });

    /* nomor halaman */
    var n = doc.getNumberOfPages();
    for (var i = 1; i <= n; i++) { doc.setPage(i); doc.setFont("times", "normal"); doc.setFontSize(12); doc.text(String(i), 105, MM.H - 15, { align: "center" }); }
    return doc.output("arraybuffer");
  }
  async function downloadPdf() {
    var out = document.getElementById("pdfMsg");
    function msg(t) { if (out) out.textContent = t; }
    if (!window.jspdf) { msg("Pembuat PDF belum termuat. Periksa koneksi, lalu muat ulang halaman."); return; }
    if (!dl) { msg("Fitur unduh tidak tersedia di tampilan ini. Gunakan Salin semua data."); return; }
    msg("Membuat PDF…");
    try {
      await Promise.all(SECTIONS.map(function (s) { return flush(s); }));
      var nm = (S.profil.nama || "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
      await dl.save({ filename: "Berkas-PPL" + (nm ? "-" + nm : "") + ".pdf", data: buildPdf() });
      msg("PDF disimpan.");
    } catch (e) {
      msg(e && e.code === "declined" ? "Unduhan dibatalkan." : "PDF gagal dibuat atau disimpan. Coba lagi.");
    }
  }

  /* ---------- boot ---------- */
  normalize(); render();
  initStore().then(function () { loaded = true; normalize(); render(); setStatus("ok"); }, function () { loaded = true; render(); setStatus("ok"); });
})();
</script>
