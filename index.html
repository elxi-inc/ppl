/* Layout: sticky header + scrollable tab strip, one working column. Form-first, summary tab shows what is still empty. */
:root {

  }

}
* { box-sizing: border-box; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }

.status { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }

.status[data-s="saving"] i { background: var(--warn); }
.status[data-s="err"] i { background: var(--err); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs button:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 22px 56px; display: flex; flex-direction: column; gap: 22px; }
.note { color: var(--muted); font-size: 13.5px; max-width: 68ch; margin: 0; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.card-rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

.card-rows .hd { background: var(--soft); font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.card-rows .rw { border-top: 1px solid var(--line); }
.card-rows .rw .no { font-family: var(--font-mono); color: var(--muted); }
@media (max-width: 640px) {
  .card-rows .hd { display: none; }
  .card-rows .rw { grid-template-columns: 28px minmax(0, 1fr); }
  .card-rows .rw > :nth-child(3), .card-rows .rw > :nth-child(4) { grid-column: 2; }
}
/* Skor */
.score { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px 14px; align-items: center; padding-block: 9px; border-top: 1px solid var(--line); }
.score:first-of-type { border-top: 0; }
@media (max-width: 560px) { .score { grid-template-columns: 1fr; } }
.result { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: baseline; padding: 12px 14px; border-radius: 8px; background: var(--soft); }
.result b { font-family: var(--font-mono); font-size: 24px; font-weight: 500; }
.result small { color: var(--muted); }
/* Ringkasan */
.prog { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-top: 1px solid var(--line); padding: 13px 2px; cursor: pointer; }
.prog:first-of-type { border-top: 0; }
.prog:hover .pl { text-decoration: underline; }
.pl { font-weight: 600; }
.pv { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); }
.prog small { grid-column: 1 / -1; color: var(--muted); }
/* Jurnal */
details.ent { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
details.ent > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; list-style-position: inside; }
details.ent > .body { padding: 6px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px; color: var(--muted); text-align: center; }
.sep { display: flex; gap: 10px; flex-wrap: wrap; }
.ckgrid { display: grid; gap: 10px 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.wt { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-left: 10px; }
.chk.w { align-items: flex-start; }
.chk.w .wt { align-self: center; }
textarea.out { font-family: var(--font-mono); font-size: 12px; min-height: 140px; }
@media (prefers-reduced-motion: no-preference) { .bar > div { transition: width .25s ease; } }
</style>

ikuti sertifikasi dan diklat (mis. diklat Canva).", "Tenaga pendukung 9 orang: tata usaha 3, perpustakaan 1, laboran lab IPA 1, teknisi lab komputer 1, laboran lab bahasa 1, kantin 1, tukang kebun 1.", "Belum ada di profil sekolah. Isi dari pengamatan: hubungan guru dengan guru, guru dengan siswa, siswa dengan siswa, dan guru dengan tata usaha.", "Peserta didik hadir pukul 07.00 (10 menit sebelum bel) dan wajib hafalan surat pendek sebelum pelajaran. Terlambat melapor ke guru piket; terlambat 3 kali berturut-turut dikenai sanksi edukatif. Upacara bendera setiap Senin. Seragam: Senin dan Selasa seragam khas, Rabu dan Kamis biru putih, Jumat dan Sabtu Pramuka. Kelas dibersihkan sebelum pelajaran. Dilarang membawa HP ke sekolah. Wajib bersikap santun dan memberi salam kepada guru.", "Tersedia ruang BK (rusak ringan). Keterlambatan ditangani guru piket harian dan BP. Guru BK belum tercatat di profil; lengkapi dari pengamatan.", "Tersedia ruang PMR/Pramuka (baik). Daftar kegiatan ekstrakurikuler belum tercatat di profil; lengkapi dari pengamatan.", "OSIS (memiliki ruang, rusak ringan), UKS (memiliki ruang, baik), dan komite sekolah.", "Ada ruang koperasi 3 x 3 m (baik). Pengelola dan jenis usaha belum tercatat; lengkapi dari pengamatan."]};

  var CONTOH = {"cp": "Peserta didik memahami dan menerapkan kejujuran dalam muamalah berdasarkan hadis pilihan, dengan membaca, mengartikan, dan menganalisis kandungannya.\n\nCatatan: tulis ulang dengan kata-katamu sendiri dan cocokkan dengan CP resmi mata pelajaran.", "soal": "A. Pilihan ganda (5 soal, skor 10 per soal, maksimum 50)\n1. Hadis riwayat Baihaqi dari Ibnu Abbas r.a. berisi peringatan keras kepada ....\nA. para petani   B. para pedagang   C. para pelajar   D. para pemimpin\n2. Dua hal yang membinasakan umat terdahulu menurut hadis tersebut adalah ....\nA. harta dan tahta   B. takaran dan timbangan   C. ilmu dan amal   D. ucapan dan tulisan\n3. Menurut hadis riwayat Tirmidzi dari Hasan bin Ali r.a., kejujuran membawa kepada ....\nA. keraguan   B. ketenangan   C. kesombongan   D. kerugian\n4. Jujur dalam muamalah adalah kesesuaian antara ....\nA. pikiran, ucapan, dan tindakan   B. harta, pangkat, dan jabatan   C. ilmu, usia, dan pengalaman   D. janji, hadiah, dan pujian\n5. Penjual online memasang foto barang yang tidak sesuai aslinya. Tindakan ini ....\nA. bertentangan dengan pesan hadis tentang kejujuran   B. boleh karena promosi   C. wajar selama laku   D. tidak berkaitan dengan hadis\nKunci: 1 B, 2 B, 3 B, 4 A, 5 A.\n\nB. Uraian (2 soal, skor maksimum 25 per soal, total 50)\n6. Jelaskan kandungan hadis riwayat Baihaqi dari Ibnu Abbas r.a.!\nKunci: peringatan keras bagi pedagang agar menyempurnakan takaran dan timbangan; umat terdahulu binasa karena curang; kejujuran menegakkan keadilan.\n7. Sebutkan tiga bentuk kejujuran menurut ulama dan contohnya di sekolah!\nKunci: tiga dari enam bentuk (berucap, berbuat, bermuamalat, bertekad, berniat, berjanji) dengan contoh yang sesuai.\n\nNilai = skor PG (maks 50) + skor uraian (maks 50).", "rubrik": "1. Bacaan hadis: Lancar, Cukup, Kurang.\n2. Diskusi kelompok (skor 4 sampai 1): keaktifan, ketepatan isi, kerja sama.\n3. Tes singkat: lihat kunci dan skor pada bagian soal.", "items": [{"waktu": "40 menit, pukul 08.25 sampai 09.05", "tgl": "", "refleksiSiswa": "Apa hal penting yang kupelajari hari ini? Bagian mana yang masih sulit? Bagaimana aku akan menerapkannya dalam kehidupan sehari-hari?", "refleksiGuru": "Apakah tujuan pembelajaran tercapai? Siapa yang memerlukan pendampingan? Apa yang perlu diperbaiki pada pertemuan berikutnya?", "ke": "1", "judul": "Jujur dalam Takaran dan Timbangan", "model": "Ceramah interaktif, menulis, dan tanya jawab", "kompetensiAwal": "Peserta didik pernah melihat atau ikut kegiatan jual beli di rumah, pasar, atau kantin.\nPeserta didik mengenal arti jujur dalam kehidupan sehari-hari.\nPeserta didik dapat menulis dan membaca tulisan Arab dengan bimbingan guru.", "tp": "Menulis hadis riwayat Baihaqi dari Ibnu Abbas r.a. dengan benar.\nMengartikan hadis dan menjelaskan pesan pokoknya tentang kejujuran dalam takaran dan timbangan.\nMenyebutkan contoh kecurangan dalam jual beli dan akibatnya.", "bermakna": "Pedagang yang jujur dalam takaran dan timbangan menjaga hak pembeli serta mendatangkan kepercayaan dan keberkahan rezeki. Kecurangan sekecil apa pun dapat merusak kepercayaan dan membawa keburukan bagi masyarakat.", "pemantik": "Pernahkah kamu merasa dirugikan saat membeli sesuatu? Apa yang kamu rasakan?\nMengapa pedagang diperingatkan secara khusus dalam hadis ini?", "cinta": ["Menaati perintah Rasulullah tentang kejujuran dalam berdagang", "Mencatat dan memahami hadis dengan teliti", "Tidak merugikan pembeli dan menghargai hak orang lain", "Menjaga tempat transaksi tetap adil dan tertib", "Membiasakan kejujuran demi masyarakat yang saling percaya"], "materi": "Hadis riwayat Baihaqi dari Ibnu Abbas r.a. beserta artinya (buku ajar hlm 47).\nKandungan hadis: peringatan bagi pedagang agar menyempurnakan takaran dan timbangan (hlm 48 sampai 49).\nContoh kecurangan dalam jual beli dan akibatnya.", "media": "Buku Al-Qur'an Hadis kelas IX, Bab 3.\nPapan tulis dan buku tulis siswa.\nTeks hadis yang ditulis guru di papan atau ditampilkan di layar.\nLKPD 1.", "langkah": [{"tahap": "Pendahuluan", "waktu": "5 menit", "akt": "Guru memberi salam, memimpin doa, memeriksa kehadiran, dan menyampaikan tujuan. Guru mengajukan pertanyaan pemantik tentang pengalaman dicurangi saat membeli sesuatu."}, {"tahap": "Kegiatan inti: menulis hadis", "waktu": "10 menit", "akt": "Guru menuliskan atau menampilkan hadis riwayat Baihaqi dari Ibnu Abbas r.a. Siswa menulis hadis beserta artinya di buku tulis dengan teliti, lalu membacanya bersama-sama. Guru membimbing siswa yang kesulitan."}, {"tahap": "Kegiatan inti: penjelasan guru", "waktu": "15 menit", "akt": "Guru menjelaskan arti kata dan kandungan hadis: pedagang diperingatkan agar tidak mengurangi takaran dan timbangan supaya tidak binasa seperti umat terdahulu. Guru memberi contoh kecurangan jual beli masa kini. Siswa menyimak, bertanya, dan mencatat inti penjelasan."}, {"tahap": "Kegiatan inti: latihan", "waktu": "5 menit", "akt": "Siswa menuliskan pesan utama hadis dan satu contoh perilaku jujur dalam jual beli (LKPD 1). Beberapa siswa menyampaikan jawabannya."}, {"tahap": "Penutup", "waktu": "5 menit", "akt": "Guru dan siswa menyimpulkan pembelajaran, siswa merefleksikan satu hal yang dipelajari, guru menyampaikan tindak lanjut, lalu menutup dengan doa dan salam."}], "lkpd": "Nama: ____________   Kelas: IX   Tanggal: ____________\n1. Tulislah hadis riwayat Baihaqi dari Ibnu Abbas r.a. beserta artinya.\n2. Jelaskan dengan kalimatmu sendiri pesan utama hadis tersebut.\n3. Tuliskan satu contoh perilaku jujur dalam jual beli.", "asesmen": "Diagnostik: tanya jawab singkat tentang pengalaman dicurangi saat membeli.\nFormatif: ketepatan dan kerapian tulisan hadis, partisipasi, dan kemampuan menjelaskan pesan hadis.\nSumatif pertemuan: jawaban tertulis pada LKPD 1.", "evaluasi": "1. Kepada siapa peringatan keras dalam hadis tersebut ditujukan?\nKunci: para pedagang.\n2. Sebutkan dua hal yang membinasakan umat terdahulu menurut hadis tersebut.\nKunci: kecurangan dalam takaran dan timbangan.\n3. Berikan satu contoh perilaku jujur dalam jual beli.\nKunci: menimbang sesuai ukuran dan menjelaskan kondisi barang dengan benar.", "rubrik": "Aspek | Skor 4 | Skor 3 | Skor 2 | Skor 1\nMenulis hadis | Tepat, lengkap, rapi | Sedikit kesalahan | Beberapa bagian kurang tepat | Belum selesai atau banyak kesalahan\nMemahami pesan hadis | Jelas dan tepat | Cukup tepat | Perlu bimbingan | Belum memahami\nSikap belajar | Aktif dan tertib | Cukup aktif | Kurang konsisten | Pasif", "diferensiasi": "Siswa yang perlu bantuan diberi hadis yang dipecah per kalimat dan pendampingan menulis; siswa yang lebih siap diminta menghubungkan hadis dengan Q.S. al-Isra' (17): 35.", "remedial": "Bimbingan menulis dan membaca ulang hadis serta mengidentifikasi kembali contoh kecurangan.", "pengayaan": "Siswa mencari contoh kejujuran pedagang di lingkungan rumah dan menceritakannya pada pertemuan berikutnya.", "tindak": "Siswa mengamati satu transaksi jual beli di sekitar rumah dan mencatat apakah penjualnya jujur, untuk dibahas pada pertemuan berikutnya."}, {"waktu": "40 menit, pukul 08.25 sampai 09.05", "tgl": "", "refleksiSiswa": "Apa hal penting yang kupelajari hari ini? Bagian mana yang masih sulit? Bagaimana aku akan menerapkannya dalam kehidupan sehari-hari?", "refleksiGuru": "Apakah tujuan pembelajaran tercapai? Siapa yang memerlukan pendampingan? Apa yang perlu diperbaiki pada pertemuan berikutnya?", "ke": "2", "judul": "Kejujuran Membawa Ketenangan", "model": "Diskusi kelompok dengan ilustrasi masalah", "kompetensiAwal": "Peserta didik mengenal perasaan tenang dan gelisah setelah berbuat benar atau salah.\nPeserta didik telah mempelajari hadis tentang kejujuran dalam takaran dan timbangan.\nPeserta didik dapat bekerja dalam kelompok kecil.", "tp": "Membaca dan mengartikan hadis riwayat Tirmidzi dari Hasan bin Ali r.a.\nMenjelaskan hubungan kejujuran dengan ketenangan dan dusta dengan keraguan.\nMenyebutkan bentuk-bentuk kejujuran menurut para ulama beserta contohnya.\nMenentukan sikap yang tepat pada ilustrasi masalah berdasarkan hadis.", "bermakna": "Kejujuran menenangkan hati, sedangkan dusta menimbulkan keraguan dan kegelisahan. Jujur dalam ucapan, perbuatan, dan muamalah membuat seseorang dipercaya dan hidupnya lebih tenteram.", "pemantik": "Apa yang kamu rasakan setelah menyembunyikan kesalahan?\nBagaimana cara memilih saat kamu ragu antara berkata jujur dan berbohong?", "cinta": ["Meyakini bahwa Allah mencintai orang yang jujur", "Memahami hadis dan menggali maknanya melalui diskusi", "Menghargai pendapat teman dan tidak merugikan orang lain", "Menciptakan suasana kelas yang tertib saat berdiskusi", "Membiasakan jujur sebagai bekal hidup bermasyarakat"], "materi": "Hadis riwayat Tirmidzi dari Hasan bin Ali r.a. beserta artinya (buku ajar hlm 50).\nKandungan hadis: meninggalkan yang meragukan, kejujuran adalah ketenangan, dusta adalah keraguan (hlm 50 sampai 51).\nEnam bentuk kejujuran: ucapan, perbuatan, muamalah, tekad, niat, dan janji.", "media": "Buku Al-Qur'an Hadis kelas IX, Bab 3.\nPapan tulis dan kartu ilustrasi masalah.\nLKPD 2.", "langkah": [{"tahap": "Pendahuluan", "waktu": "5 menit", "akt": "Salam, doa, cek kehadiran, dan murajaah hadis pertemuan pertama oleh beberapa siswa. Guru menyampaikan tujuan dan mengajukan pertanyaan pemantik."}, {"tahap": "Kegiatan inti: pembagian kelompok dan ilustrasi masalah", "waktu": "8 menit", "akt": "Guru membacakan hadis beserta artinya, lalu membagi siswa menjadi kelompok 3 sampai 5 orang dan memberikan kartu ilustrasi masalah (misalnya siswa menemukan uang di jalan dan ragu mengembalikannya, atau penjual online menyembunyikan cacat barang)."}, {"tahap": "Kegiatan inti: diskusi kelompok", "waktu": "14 menit", "akt": "Siswa mendiskusikan ilustrasi bersama kelompoknya: bagian mana yang menimbulkan keraguan, bentuk kejujuran apa yang terkait, dan tindakan yang sebaiknya dipilih berdasarkan hadis. Hasil ditulis pada LKPD 2. Guru berkeliling membimbing."}, {"tahap": "Kegiatan inti: presentasi dan penguatan", "waktu": "8 menit", "akt": "Dua kelompok menyampaikan hasil diskusi, kelompok lain menanggapi, dan guru memberi penguatan tentang enam bentuk kejujuran."}, {"tahap": "Penutup", "waktu": "5 menit", "akt": "Guru dan siswa menyimpulkan bahwa kejujuran membawa ketenangan dan dusta membawa keraguan, melakukan refleksi singkat, menyampaikan tindak lanjut, lalu doa dan salam."}], "lkpd": "Kelompok: ____________   Anggota: ____________\n1. Tuliskan masalah pada kartu ilustrasi kelompokmu.\n2. Bagian mana yang menimbulkan keraguan dan mana yang membawa ketenangan?\n3. Bentuk kejujuran apa yang berkaitan dengan masalah itu?\n4. Apa tindakan yang sebaiknya dilakukan berdasarkan hadis? Jelaskan alasannya.", "asesmen": "Diagnostik: tanya jawab tentang perasaan setelah berbuat jujur atau tidak jujur.\nFormatif: observasi keaktifan dan kerja sama kelompok, ketepatan hasil LKPD 2, dan tanggapan saat presentasi.\nSumatif pertemuan: LKPD 2 dan kuis lisan.", "evaluasi": "1. Apa arti 'kejujuran adalah ketenangan' menurut hadis tersebut?\nKunci: kejujuran membuat hati tenang dan tidak ragu.\n2. Sebutkan tiga bentuk kejujuran menurut para ulama.\nKunci: tiga dari ucapan, perbuatan, muamalah, tekad, niat, dan janji.\n3. Apa yang sebaiknya dilakukan ketika ragu antara jujur dan berbohong?\nKunci: meninggalkan yang meragukan dan memilih jujur.", "rubrik": "Aspek | Skor 4 | Skor 3 | Skor 2 | Skor 1\nKerja sama kelompok | Semua anggota aktif dan saling menghargai | Sebagian besar aktif | Hanya sebagian kecil aktif | Pasif atau mengganggu\nKetepatan hasil diskusi | Tepat dan beralasan dengan hadis | Tepat, alasan kurang lengkap | Sebagian tepat | Belum tepat\nPresentasi | Jelas, runtut, percaya diri | Jelas | Kurang jelas | Belum dapat menyampaikan", "diferensiasi": "Kelompok diberi ilustrasi dengan tingkat kerumitan berbeda; siswa yang membutuhkan bantuan dibimbing langsung, siswa yang lebih siap diminta merumuskan lebih dari satu solusi.", "remedial": "Membaca ulang hadis dan artinya, lalu menjawab ulang pertanyaan inti secara lisan.", "pengayaan": "Menuliskan satu pengalaman nyata ketika kejujuran memberi rasa tenang, lalu menceritakannya di depan kelas.", "tindak": "Siswa mencatat satu situasi minggu ini ketika mereka memilih jujur dan menuliskan perasaannya."}, {"waktu": "40 menit, pukul 08.25 sampai 09.05", "tgl": "", "refleksiSiswa": "Apa hal penting yang kupelajari hari ini? Bagian mana yang masih sulit? Bagaimana aku akan menerapkannya dalam kehidupan sehari-hari?", "refleksiGuru": "Apakah tujuan pembelajaran tercapai? Siapa yang memerlukan pendampingan? Apa yang perlu diperbaiki pada pertemuan berikutnya?", "ke": "3", "judul": "Jujur dalam Muamalah Sehari-hari", "model": "Ceramah interaktif, diskusi kelompok, dan tes singkat", "kompetensiAwal": "Peserta didik telah mempelajari dua hadis tentang kejujuran pada pertemuan sebelumnya.\nPeserta didik mengenal contoh transaksi jual beli langsung dan daring.\nPeserta didik dapat menyimpulkan hasil diskusi secara sederhana.", "tp": "Menjelaskan pengertian muamalah beserta aspek adabiyah dan madaniyah.\nMenjelaskan jujur dalam muamalah dan memberi contohnya.\nMenentukan cara bertransaksi yang jujur, termasuk secara daring, berdasarkan hadis.\nMenunjukkan pemahaman Bab 3 melalui tes singkat.", "bermakna": "Muamalah mengatur pergaulan dan transaksi antar manusia. Kejujuran di dalamnya menjaga keadilan, kepercayaan, dan keberkahan, sehingga jual beli atas dasar suka sama suka membuat hubungan masyarakat tenteram.", "pemantik": "Apa arti berkah dalam jual beli menurutmu?\nBagaimana bentuk ketidakjujuran dalam belanja daring dan bagaimana mencegahnya?", "cinta": ["Menaati perintah Allah untuk bersama orang-orang yang benar", "Mempelajari ayat dan hadis untuk dijadikan pedoman bertransaksi", "Tidak merugikan pembeli maupun penjual", "Menjaga lingkungan transaksi yang tertib dan saling percaya", "Membiasakan jujur untuk kehidupan masyarakat yang baik"], "materi": "Pengertian muamalah: aspek adabiyah dan madaniyah.\nQ.S. at-Taubah (9): 119 dan Q.S. an-Nisa (4): 29 beserta artinya (hlm 52 sampai 53).\nContoh jujur dalam muamalah dan etika bermuamalah (hlm 53 sampai 54).", "media": "Buku Al-Qur'an Hadis kelas IX, Bab 3.\nPapan tulis, kartu ilustrasi masalah, dan LKPD 3.\nLembar soal akhir bab.", "langkah": [{"tahap": "Pendahuluan", "waktu": "3 menit", "akt": "Salam, doa, dan murajaah kedua hadis. Guru menyampaikan tujuan dan pertanyaan pemantik."}, {"tahap": "Kegiatan inti: penjelasan guru dan menulis", "waktu": "10 menit", "akt": "Guru menjelaskan pengertian muamalah (adabiyah dan madaniyah), Q.S. at-Taubah (9): 119, Q.S. an-Nisa (4): 29, dan contoh jujur dalam muamalah. Siswa menulis ringkasan dan tiga contoh perilaku jujur dalam muamalah di buku tulis."}, {"tahap": "Kegiatan inti: kelompok dan ilustrasi masalah", "waktu": "12 menit", "akt": "Guru membagi kelompok 3 sampai 5 orang dan memberikan ilustrasi masalah jual beli (penjual online mengobral janji, barang tidak sesuai foto, atau timbangan dikurangi). Siswa mendiskusikan bagian yang tidak jujur dan cara bertransaksi yang jujur sesuai hadis (LKPD 3), lalu satu kelompok menyampaikan hasilnya."}, {"tahap": "Kegiatan inti: soal akhir bab", "waktu": "10 menit", "akt": "Siswa mengerjakan 5 soal pilihan ganda dan 2 soal uraian secara mandiri."}, {"tahap": "Penutup", "waktu": "5 menit", "akt": "Guru dan siswa menyimpulkan Bab 3, siswa menuliskan komitmen kejujuran, lalu doa dan salam."}], "lkpd": "Kelompok: ____________   Anggota: ____________\n1. Tuliskan ilustrasi masalah yang diterima kelompokmu.\n2. Bagian mana yang tidak jujur dan apa akibatnya?\n3. Bagaimana cara bertransaksi yang jujur sesuai kedua hadis?", "asesmen": "Diagnostik: tanya jawab tentang makna berkah dalam jual beli.\nFormatif: observasi diskusi kelompok dan hasil LKPD 3.\nSumatif: tes tertulis singkat akhir bab (5 pilihan ganda dan 2 uraian).", "evaluasi": "Soal akhir bab: 5 soal pilihan ganda dan 2 soal uraian, lengkap dengan kunci pada bagian Soal Asesmen Sumatif dan Kunci.", "rubrik": "Aspek | Skor 4 | Skor 3 | Skor 2 | Skor 1\nHasil diskusi ilustrasi | Lengkap dan beralasan | Tepat | Sebagian tepat | Belum tepat\nKetepatan jawaban soal | Hampir semua benar | Sebagian besar benar | Sebagian benar | Banyak yang salah\nSikap belajar | Aktif dan tertib | Cukup aktif | Kurang konsisten | Pasif", "diferensiasi": "Siswa yang membutuhkan bantuan diberi ilustrasi yang lebih sederhana; siswa yang lebih siap diminta menyusun panduan singkat transaksi daring yang jujur.", "remedial": "Pembahasan ulang soal yang belum tepat dan latihan menyebutkan contoh jujur dalam muamalah.", "pengayaan": "Siswa membuat poster singkat ajakan jujur dalam bertransaksi.", "tindak": "Siswa membiasakan jujur dalam transaksi sehari-hari dan menyampaikan pengalamannya kepada guru atau orang tua."}], "atpRows": [{"tp": "Peserta didik mampu membaca dan mengartikan hadis riwayat Baihaqi dari Ibnu Abbas r.a. serta menjelaskan kandungannya tentang kejujuran dalam menakar dan menimbang.", "materi": "Hadis HR. Baihaqi (buku hlm 47 sampai 49)", "jp": "1", "ke": "1"}, {"tp": "Peserta didik mampu membaca dan mengartikan hadis riwayat Tirmidzi dari Hasan bin Ali r.a. serta menjelaskan enam bentuk kejujuran.", "materi": "Hadis HR. Tirmidzi (buku hlm 50 sampai 51)", "jp": "1", "ke": "2"}, {"tp": "Peserta didik mampu menjelaskan jujur dalam muamalah beserta contohnya dan menunjukkan pemahaman Bab III.", "materi": "Konsep jujur dalam muamalah (buku hlm 52 sampai 54)", "jp": "1", "ke": "3"}], "dim": [true, false, true, false, true, false, false, true], "bab": "Bab 3: Menggapai Keberkahan Hidup dengan Jujur dalam Muamalah", "pendekatan": "Kurikulum Berbasis Cinta (KBC) dan pembelajaran mendalam"};

  function touch(sec) { dirty[sec] = true; setStatus("saving"); clearTimeout(timers[sec]); timers[sec] = setTimeout(function () { flush(sec); }, 700); }
  function flush(sec) {
    if (!dirty[sec]) return chains[sec] || Promise.resolve();
    dirty[sec] = false; clearTimeout(timers[sec]);
    var snap = clone(S[sec]);
    chains[sec] = (chains[sec] || Promise.resolve()).then(function () {

      var pending = SECTIONS.some(function (s) { return dirty[s]; });

    return chains[sec];

        blk("Kompetensi Awal", it.kompetensiAwal);

        if (filled(S.rpp.cp)) { line("Capaian Pembelajaran:", { indent: 4, italic: true }); String(S.rpp.cp).split("\n").forEach(function (t) { if (t.trim()) line(t, { indent: 8 }); }); }
        if (filled(it.tp)) { line("Tujuan Pembelajaran:", { indent: 4, italic: true }); String(it.tp).split("\n").forEach(function (t, k) { if (t.trim()) line((k + 1) + ". " + t, { indent: 8 }); }); }
        if (filled(it.bermakna) || filled(it.pemantik)) {

        }
        if ((it.cinta || []).some(filled)) {

          table(["Nilai cinta", "Implementasi dalam modul"], [50, 90], CINTA.map(function (c, k) { return [c, (it.cinta || [])[k] || ""]; }), { minH: 7 });
        }
        blk("Materi Pembelajaran", it.materi);
        blk("Media dan Sumber Belajar", it.media);
        if ((it.langkah || []).length) {
          gap(0.2); line(LT.charAt(n++) + ". Langkah-Langkah Pembelajaran", { bold: true }); gap(0.1);
          table(["Tahap", "Waktu", "Aktivitas Pembelajaran"], [34, 18, 88], it.langkah.map(function (r) { return [r.tahap || "", r.waktu || "", r.akt || ""]; }), { minH: 8 });
        } else if (filled(it.awal) || filled(it.inti) || filled(it.akhir)) {
          blk("Langkah-Langkah Pembelajaran", [it.awal, it.inti, it.akhir].filter(filled).join("\n"));
        }
        blk("LKPD", it.lkpd);
        blk("Asesmen", it.asesmen);
        blk("Evaluasi dan Kunci Jawaban", it.evaluasi);
        if (filled(it.rubrik)) {
          var rr = String(it.rubrik).split("\n").filter(function (x) { return x.trim(); }).map(function (x) { return x.split("|").map(function (c) { return c.trim(); }); });
          if (rr.length > 1) {
            gap(0.2); line(LT.charAt(n++) + ". Rubrik Penilaian", { bold: true }); gap(0.1);
            var cols = rr[0].length, wd = [34].concat(Array(cols - 1).fill(Math.floor(106 / (cols - 1))));
            wd[wd.length - 1] += 140 - wd.reduce(function (a, b) { return a + b; }, 0);
            table(rr[0], wd, rr.slice(1).map(function (r) { while (r.length < cols) r.push(""); return r.slice(0, cols); }), { minH: 7 });
          } else blk("Rubrik Penilaian", it.rubrik);
        }
        if (filled(it.diferensiasi) || filled(it.remedial) || filled(it.pengayaan)) {
          gap(0.2); line(LT.charAt(n++) + ". Diferensiasi, Remedial, dan Pengayaan", { bold: true });
          [["Diferensiasi", it.diferensiasi], ["Remedial", it.remedial], ["Pengayaan", it.pengayaan]].forEach(function (x) { if (filled(x[1])) line(x[0] + ": " + x[1], { indent: 4 }); });
        }
        if (filled(it.refleksiSiswa) || filled(it.refleksiGuru) || filled(it.refleksi)) {
          gap(0.2); line(LT.charAt(n++) + ". Refleksi", { bold: true });
          if (filled(it.refleksiSiswa)) line("Refleksi peserta didik: " + it.refleksiSiswa, { indent: 4 });
          if (filled(it.refleksiGuru)) line("Refleksi guru: " + it.refleksiGuru, { indent: 4 });

        doc.text(latin(P.pamong || "............................"), MM.L, y + 4.7); doc.text(latin(P.nama || "............................"), MM.L + 85, y + 4.7);
        doc.text("NIP.", MM.L, y + 4.7 + LH); doc.text("NPM. " + latin(P.npm || ""), MM.L + 85, y + 4.7 + LH); y += LH * 2;
      });
    }

    if (o.asesmen) {
      sec("Asesmen", false);

      para("Rubrik dan Instrumen Penilaian", S.rpp.rubrik);

      table(["Bab", "Bagian", "Poin", "Status"], [20, 80, 16, 24], rl, { minH: 8 });
      line("Poin terpenuhi: " + pctWeights("lap", [].concat.apply([], LAPORAN.map(function (b) { return b[1]; })), true) + " dari 100", { bold: true }); gap(0.3);

      var ra = ARTIKEL.map(function (r, i) { return [String(i + 1), r[0], String(r[1]), getp("nilai.art." + i) ? "Sudah" : "Belum"]; });
      table(["No", "Aspek", "Poin", "Status"], [10, 90, 16, 24], ra, { minH: 8 });

    /* nomor halaman */
    var n = doc.getNumberOfPages();

  }
  async function downloadPdf() {
    var out = document.getElementById("pdfMsg");
    function msg(t) { if (out) out.textContent = t; }
    if (!window.jspdf) { msg("Pembuat PDF belum termuat. Periksa koneksi, lalu muat ulang halaman."); return; }
    if (!dl) { msg("Fitur unduh tidak tersedia di tampilan ini. Gunakan Salin semua data."); return; }
    var o = {}, n = 0;
    PDFOPT.forEach(function (x) { var el = document.getElementById("pdfopt_" + x[0]); o[x[0]] = !el || el.checked; if (o[x[0]]) n++; });
    if (!n) { msg("Centang minimal satu bagian yang mau dicetak."); return; }
    msg("Membuat PDF…");
    try {
      await Promise.all(SECTIONS.map(function (s) { return flush(s); }));
      var nm = (S.profil.nama || "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
      var kind = n === PDFOPT.length ? "Berkas-PPL" : (!o.observasi && !o.bimbingan && !o.laporan) ? "PPM" : "Cetak-PPL";
      await dl.save({ filename: kind + (nm ? "-" + nm : "") + ".pdf", data: buildPdf(o) });
      msg("PDF disimpan.");
    } catch (e) {
      msg(e && e.code === "declined" ? "Unduhan dibatalkan." : "PDF gagal dibuat atau disimpan. Coba lagi.");
    }
  }

  async function uploadBuku() {
    var out = document.getElementById("bukuMsg");
    function msg(t) { if (out) out.textContent = t; }
    var inp = document.getElementById("fbuku"), f = inp && inp.files && inp.files[0];
    if (!assetsApi) { msg("Unggah tidak tersedia di tampilan ini."); return; }
    if (!f) { msg("Pilih berkas PDF dulu."); return; }
    if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") { msg("Berkas harus berformat PDF."); return; }
    if (f.size > 20 * 1048576) { msg("Berkas " + mb(f.size) + " melebihi batas 20 MB. Kompres dulu."); return; }
    msg("Mengunggah " + f.name + "…");
    try {
      var r = await assetsApi.upload(f, { type: "application/pdf" });
      var nm = (document.getElementById("fbukunama").value || "").trim() || f.name.replace(/\.pdf$/i, "");
      S.buku.items.push({ id: r.id, nama: nm, catatan: (document.getElementById("fbukucat").value || "").trim(), ukuran: r.sizeBytes, tgl: new Date().toISOString().slice(0, 10) });
      touch("buku"); render();
      var m2 = document.getElementById("bukuMsg"); if (m2) m2.textContent = "Terunggah dan tersimpan: " + nm + ".";
    } catch (e) {
      var c = e && e.code;
      msg(c === "too_large" ? "Berkas terlalu besar. Kompres dulu." : c === "quota_or_state" ? "Ruang penyimpanan halaman ini penuh." : c === "rate_limited" ? "Terlalu sering. Coba lagi sebentar lagi." : "Unggah gagal. Coba lagi.");
    }
  }
  async function removeBuku(i) {
    var it = S.buku.items[i]; if (!it) return;
    try { if (assetsApi) await assetsApi.delete(it.id); } catch (e) { /* tetap hapus baris */ }
    S.buku.items.splice(i, 1); touch("buku"); render();
  }

  /* ---------- boot ---------- */
  normalize(); render();
  function seed() {
    var oldSample = typeof S.rpp.atp === "string" && /^(Semester 1|Bab III: Menggapai)/.test(S.rpp.atp) && !S.rpp.atpRows.length;
    if (oldSample) { S.rpp.atp = ""; S.rpp.cp = ""; S.rpp.soal = ""; S.rpp.rubrik = ""; S.rpp.items = []; S.rpp.seeded = false; }
    var empty = !filled(S.rpp.cp) && !S.rpp.atpRows.length && !S.rpp.items.length && !filled(S.rpp.soal) && !filled(S.rpp.rubrik);
    if (S.rpp.seeded || !empty) return;
    S.rpp.cp = CONTOH.cp; S.rpp.atpRows = clone(CONTOH.atpRows); S.rpp.dim = clone(CONTOH.dim); S.rpp.soal = CONTOH.soal; S.rpp.rubrik = CONTOH.rubrik;
    CONTOH.items.forEach(function (it) { S.rpp.items.push(clone(it)); });
    S.rpp.seeded = true; S.rpp.bab = CONTOH.bab; S.rpp.pendekatan = CONTOH.pendekatan;
    if (!filled(S.profil.mapel)) S.profil.mapel = "Al-Qur'an Hadis";
    if (!filled(S.profil.kelas)) S.profil.kelas = "IX / Fase D";
    touch("rpp"); touch("profil");
  }
  function migrateLangkah() {
    if (S.rpp.seedVer === 3) return;
    var it = S.rpp.items;
    var mine = it.length && it.every(function (x) { return !x.langkah && /^(Menulis hadis \(12 menit\)|Pembagian kelompok dan ilustrasi masalah \(8 menit\)|Penjelasan dan menulis \(10 menit\))/.test(x.inti || ""); });
    if (mine) {
      S.rpp.items = CONTOH.items.map(function (x) { return clone(x); });
      S.rpp.bab = CONTOH.bab; S.rpp.pendekatan = CONTOH.pendekatan;
    }
    S.rpp.seedVer = 3; touch("rpp");
  }
  function seedSekolah() {
    if (S.observasi.sekolahSeeded) return;
    if (!filled(S.profil.lokasi)) S.profil.lokasi = SEKOLAH.lokasi;
    if (!filled(S.profil.kepsek)) S.profil.kepsek = SEKOLAH.kepsek;
    if (!S.observasi.kondisi) S.observasi.kondisi = [];
    SEKOLAH.kondisi.forEach(function (t, i) { if (!filled(S.observasi.kondisi[i])) S.observasi.kondisi[i] = t; });
    S.observasi.sekolahSeeded = true;
    touch("observasi"); touch("profil");
  }
  initStore().then(function () { loaded = true; normalize(); seed(); migrateLangkah(); seedSekolah(); render(); setStatus("ok"); }, function () { loaded = true; render(); setStatus("ok"); });
})();
